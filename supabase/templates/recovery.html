<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reset your Discora password</title>
</head>
<body style="margin:0;padding:0;background-color:#fafafa;font-family:system-ui,-apple-system,sans-serif;">
  <div style="max-width:560px;margin:0 auto;padding:32px 24px;">
    <h1 style="font-size:20px;color:#111111;">Reset your Discora password</h1>
    <p style="font-size:14px;line-height:1.6;color:#444444;">
      We received a request to reset the password for this email address.
      Follow the link below to choose a new one. The link expires shortly
      and can only be used once.
    </p>
    <p style="margin:24px 0;">
      <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=recovery"
         style="display:inline-block;padding:12px 24px;background-color:#2563eb;color:#ffffff;text-decoration:none;border-radius:8px;font-size:14px;font-weight:600;">Reset password</a>
    </p>
    <p style="font-size:13px;line-height:1.6;color:#888888;">
      If you didn't request this, you can safely ignore this email.
    </p>
  </div>
</body>
</html>
